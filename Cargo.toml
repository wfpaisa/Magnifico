[package]
name = "magnifico"
version = "1.0.3"
edition = "2021"
authors = ["wfpaisa"]
description = "Magnífico is a native GNOME application for safely cleaning browser data, application caches, and temporary files"
license = "MIT"
repository = "https://github.com/wfpaisa/Magnifico"
homepage = "https://github.com/wfpaisa/Magnifico"
keywords = ["gnome", "cleaner", "linux", "system", "utility"]
categories = ["gui", "filesystem"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_8"] }
libadwaita = { version = "0.7", features = ["v1_5"] }

glib = "0.20"
gio = "0.20"

tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
async-channel = "2"
once_cell = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dirs = "5"
walkdir = "2"
glob = "0.3"
rayon = "1"

bytesize = "1"

chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1"

libc = "0.2"
sysinfo = "0.30"

uuid = { version = "1", features = ["v4", "serde"] }

# StatusNotifierItem tray icon (KDE and GNOME with AppIndicator support)
ksni = "0.3"

# Content hashes for the duplicate finder
blake3 = "1"

[build-dependencies]
glib-build-tools = "0.20"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "wfpaisa"
copyright = "See LICENSE"
license-file = ["LICENSE", "0"]
extended-description = "Magnífico is a native GNOME application for safely cleaning browser data, application caches, and temporary files"
depends = "$auto, libgtk-4-1, libadwaita-1-0 (>= 1.5)"
section = "utility"
priority = "optional"
assets = [
    ["target/release/magnifico", "usr/bin/", "755"],
    ["data/io.github.wfpaisa.Magnifico.desktop", "usr/share/applications/", "644"],
    ["data/io.github.wfpaisa.Magnifico.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.wfpaisa.Magnifico.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/symbolic/apps/io.github.wfpaisa.Magnifico-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/magnifico", dest = "/usr/bin/magnifico", mode = "755" },
    { source = "data/io.github.wfpaisa.Magnifico.desktop", dest = "/usr/share/applications/io.github.wfpaisa.Magnifico.desktop", mode = "644" },
    { source = "data/io.github.wfpaisa.Magnifico.metainfo.xml", dest = "/usr/share/metainfo/io.github.wfpaisa.Magnifico.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github.wfpaisa.Magnifico.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.wfpaisa.Magnifico.svg", mode = "644" },
    { source = "data/icons/hicolor/symbolic/apps/io.github.wfpaisa.Magnifico-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/io.github.wfpaisa.Magnifico-symbolic.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.8"
libadwaita = ">= 1.5"
